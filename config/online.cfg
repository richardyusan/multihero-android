# MultiHero online settings (copied into the game data by tools/prep_assets.py).
# A copy named online.cfg in the app's data folder overrides this file.
#
# MULTIPLAYER ONLINE opens the lobby of the online servers (Cloudflare Worker, the same rooms
# as the web version); the "epic online" button in the lobby switches to Epic Online Services.
#
# backend:  auto   = "worker" when server is a web address (https://...), otherwise "demo"
#           worker = Cloudflare Worker rooms (github.com/richardyusan/multihero-server):
#                    4 servers, public rooms, private rooms joined with a code
#           eos    = Epic Online Services P2P (needs the EOS SDK and the eos_* values below)
#           demo   = offline simulation (fake rooms and bots) - works without internet
#           relay  = TCP lobby server on a VPS (server/lobby_server.py, Android/Linux only)
backend = auto

# online server: the Cloudflare Worker (WebSocket rooms at <server>/room/<CODE>),
# or the host name of a VPS for backend = relay
server = https://multihero-server.multihero-web.workers.dev
port = 7777

# player name shown in rooms (empty = random "player1234", remembered on the device;
# it can be changed with the "name" button in the lobby)
name =

# Epic Online Services (the "epic online" lobby) - keep the values in online.local.cfg
eos_product_id =
eos_sandbox_id =
eos_deployment_id =
eos_client_id =
eos_client_secret =
