# MultiHero online settings (copied into the APK assets by tools/prep_assets.py).
# A copy named online.cfg in the app's data folder overrides this file.
#
# backend:  auto  = "relay" when a server is set below, otherwise "demo"
#           demo  = offline simulation (fake rooms and bots) - works without internet
#           relay = your own lobby server, e.g. on an Oracle Cloud free VPS (server/lobby_server.py)
#           eos   = Epic Online Services P2P (needs the EOS SDK, see docs/ONLINE.md)
backend = auto

# relay backend: host name or IP of the VPS running server/lobby_server.py
server =
port = 7777

# player name shown in rooms (empty = random "player1234", remembered on the device)
name =

# Epic Online Services (backend = eos)
eos_product_id =
eos_sandbox_id =
eos_deployment_id =
eos_client_id =
eos_client_secret =
